<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <title>料仓控制台演示</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10151b;
    }

    .demo-shell {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10151b;
    }

    .demo-frame {
      width: 1920px;
      height: 1080px;
      border: 0;
      transform: scale(var(--demo-scale, 1));
      transform-origin: center;
    }
  </style>
</head>
<body>
  <main class="demo-shell" aria-label="1920×1080 工控机演示画布">
    <iframe
      class="demo-frame"
      id="demoFrame"
      title="料仓控制台演示"
      width="1920"
      height="1080"
    ></iframe>
  </main>
  <script type="module">
    import { demoDisplayScale, demoFrameURL, demoVisibleURL } from "./assets/demo-shell.mjs";

    const frame = document.querySelector("#demoFrame");
    frame.src = demoFrameURL(window.location.href).href;

    function fitDemoFrame() {
      frame.style.setProperty("--demo-scale", String(demoDisplayScale(window.innerWidth, window.innerHeight)));
    }

    window.history.replaceState(null, "", demoVisibleURL(window.location.href).href);
    fitDemoFrame();
    window.addEventListener("resize", fitDemoFrame, { passive: true });
  </script>
</body>
</html>
