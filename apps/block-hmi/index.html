<!doctype html>
<html lang="zh-CN" data-simulation-mode="__BLOCK_HMI_SOURCE_SIMULATION__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block 本地控制</title>
  <link rel="stylesheet" href="assets/hmi.css">
</head>
<body>
  <main id="hmi">
    <header class="topbar">
      <div>
        <p class="eyebrow">BLOCK LOCAL HMI</p>
        <h1 id="page-title">Block 本地控制</h1>
      </div>
      <p id="connection-status" role="status">请登录后连接设备</p>
    </header>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>

    <section id="auth-panel" class="panel auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">本机登录</h2>
      <form id="login-form">
        <label>用户名<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
      </form>

      <details>
        <summary>首次安装：设置管理员密码</summary>
        <form id="initial-admin-form">
          <label>管理员用户名<input name="username" value="admin" autocomplete="username" required></label>
          <label>密码<input name="password" type="password" autocomplete="new-password" required></label>
          <label>确认密码<input name="confirmPassword" type="password" autocomplete="new-password" required></label>
          <button type="submit">创建管理员</button>
        </form>
      </details>
    </section>

    <section id="runtime-panel" hidden>
      <div id="runtime-layout" class="runtime-layout"></div>
      <section class="panel password-panel" aria-labelledby="password-title">
        <h2 id="password-title">修改密码</h2>
        <form id="password-form">
          <label>当前密码<input name="currentPassword" type="password" autocomplete="current-password" required></label>
          <label>新密码<input name="newPassword" type="password" autocomplete="new-password" required></label>
          <label>确认新密码<input name="confirmPassword" type="password" autocomplete="new-password" required></label>
          <button type="submit">修改密码</button>
        </form>
        <button id="logout-button" class="secondary" type="button">退出登录</button>
      </section>
    </section>
  </main>
  <script type="module" src="assets/hmi.mjs"></script>
</body>
</html>
